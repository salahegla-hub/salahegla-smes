[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- Redirects: preserve old URLs from the previous static site ----
[[redirects]]
  from = "/"
  to = "/ar/"
  status = 301
  force = true

[[redirects]]
  from = "/articles/infrastructure-sme-finance-gulf"
  to = "/ar/articles/infrastructure-sme-finance-gulf"
  status = 301

[[redirects]]
  from = "/articles/*"
  to = "/ar/articles/:splat"
  status = 301

[[redirects]]
  from = "/ar/consultation"
  to = "/ar/contact"
  status = 301

[[redirects]]
  from = "/en/consultation"
  to = "/en/contact"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
